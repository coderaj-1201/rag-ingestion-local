version: "3.9"
# Local dev: all 3 ingestion agents without Docker (use scripts/start_local.sh)
# OR with Docker: docker compose up --build
#
# Requires: .env file with Azure credentials filled in

x-common: &common
  build: .
  env_file: .env
  environment:
    RETRIEVAL_MODE: http
  restart: on-failure

services:

  ingestion-agent:
    <<: *common
    build:
      context: .
      args:
        AGENT_MODULE: agents.ingestion_agent
        AGENT_PORT: "8010"
    image: rag-ingestion:local
    ports:
      - "8010:8010"
    environment:
      AGENT_PORT: "8010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  processing-agent:
    <<: *common
    build:
      context: .
      args:
        AGENT_MODULE: agents.processing_agent
        AGENT_PORT: "8011"
    image: rag-processing:local
    ports:
      - "8011:8011"
    environment:
      AGENT_PORT: "8011"
    depends_on:
      ingestion-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  embedding-agent:
    <<: *common
    build:
      context: .
      args:
        AGENT_MODULE: agents.embedding_agent
        AGENT_PORT: "8012"
    image: rag-embedding:local
    ports:
      - "8012:8012"
    environment:
      AGENT_PORT: "8012"
    depends_on:
      processing-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 15s
      timeout: 5s
      retries: 3
